<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thông báo Core Team — Chess Năng Khiếu</title>
  <link rel="icon" id="favicon" href="logoCNK.jpg" />
  <meta name="description" id="meta-desc" content="Kết quả tuyển chọn Core Team CNK nhiệm kỳ 2026 – 2027" />
  <meta property="og:title" id="og-title" content="Chess Năng Khiếu" />
  <meta property="og:description" id="og-desc" content="Kết quả tuyển chọn Core Team CNK nhiệm kỳ 2026 – 2027" />
  <meta property="og:image" id="og-image" content="logoCNK.jpg" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Great+Vibes&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --bg: #0a1f3d;
      --bg-deep: #061427;
      --text: #f4f7fb;
      --text-soft: #c6d2e6;
      --text-dim: #7d8aa8;
      --gold: #f5c451;
      --gold-soft: #e8b86d;
      --gold-glow: rgba(245, 196, 81, 0.55);
      --blue: #2b6cb0;
      --blue-light: #4a90d9;
      --glass: rgba(255, 255, 255, 0.04);
      --glass-border: rgba(245, 196, 81, 0.18);
      --glass-hi: rgba(245, 196, 81, 0.32);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Be Vietnam Pro', system-ui, sans-serif;
      background: var(--bg-deep);
      color: var(--text);
      overflow: hidden;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }
    .serif { font-family: 'Cormorant Garamond', Georgia, serif; }

    .ambient { position: fixed; inset: 0; overflow: hidden; z-index: 0; pointer-events: none; }
    .board {
      position: absolute; inset: 0;
      background: linear-gradient(135deg, var(--bg-deep) 0%, var(--bg) 60%, var(--bg-deep) 100%);
    }
    .board::before {
      content: ""; position: absolute; inset: -90% -10% -10% -10%;
      background-image:
        linear-gradient(45deg, rgba(245,196,81,0.14) 25%, transparent 25%, transparent 75%, rgba(245,196,81,0.14) 75%),
        linear-gradient(45deg, rgba(245,196,81,0.14) 25%, transparent 25%, transparent 75%, rgba(245,196,81,0.14) 75%);
      background-size: 80px 80px;
      background-position: 0 0, 40px 40px;
      opacity: 0.6;
      transform: perspective(800px) rotateX(70deg) translateY(-10%);
      mask-image: radial-gradient(ellipse at 50% 30%, black 30%, transparent 75%);
      -webkit-mask-image: radial-gradient(ellipse at 50% 30%, black 30%, transparent 75%);
    }
    .orb { position: absolute; border-radius: 50%; filter: blur(60px); opacity: 0.2; }
    .orb-1 { width: 380px; height: 380px; background: var(--gold); top: -12%; left: -8%; }
    .orb-2 { width: 460px; height: 460px; background: var(--blue); bottom: -22%; right: -12%; opacity: 0.25; }
    .orb-3 { width: 260px; height: 260px; background: #1e3a5f; top: 45%; left: 55%; opacity: 0.3; }
    .grain {
      position: absolute; inset: 0;
      background-image: radial-gradient(rgba(245,196,81,0.05) 1px, transparent 1px);
      background-size: 3px 3px; opacity: 0.4;
    }

    .scene {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      padding: 32px; text-align: center;
      opacity: 0; visibility: hidden;
      transform: translateY(24px) scale(0.97);
      transition: opacity 0.7s ease, transform 0.7s cubic-bezier(0.25,1,0.5,1);
      z-index: 10;
    }
    .scene.active { opacity: 1; visibility: visible; transform: translateY(0) scale(1); }

    .line {
      font-size: clamp(1.5rem, 3.6vw, 2.6rem); font-weight: 300; line-height: 1.5;
      max-width: 880px; min-height: 6rem;
      text-shadow: 0 4px 18px rgba(0,0,0,0.75); letter-spacing: 0.01em;
    }
    .line .em { color: var(--gold); font-weight: 500; }
    .cursor {
      display: inline-block; width: 3px; height: 1em; background: var(--gold);
      vertical-align: -0.12em; margin-left: 2px; animation: blink 0.85s infinite;
    }

    .btn {
      background: rgba(245,196,81,0.06); color: var(--text);
      border: 1px solid var(--glass-border); padding: 13px 38px;
      font-size: 1.05rem; font-family: inherit; font-weight: 500;
      border-radius: 999px; cursor: pointer;
      margin-top: 44px; opacity: 0; transform: translateY(16px); pointer-events: none;
      transition: opacity .35s ease, transform .35s ease, background .3s, border-color .3s, box-shadow .3s;
    }
    .btn.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
    .btn:hover { background: rgba(245,196,81,0.16); border-color: var(--gold); box-shadow: 0 0 22px var(--gold-glow); }
    .btn-primary { background: transparent; color: var(--gold); border: 2px solid var(--gold); box-shadow: 0 0 16px var(--gold-glow); }
    .btn-primary:hover { background: var(--gold); color: var(--bg-deep); }

    .start-wrap { display: flex; flex-direction: column; align-items: center; gap: 26px; }
    .crest {
      width: 104px; height: 104px; border-radius: 50%;
      border: 1.5px solid var(--gold);
      background: radial-gradient(circle at 30% 25%, rgba(245,196,81,0.28), transparent 65%), rgba(10,31,61,0.6);
      display: flex; align-items: center; justify-content: center; font-size: 2.8rem; color: var(--gold);
      box-shadow: inset 0 0 30px rgba(245,196,81,0.18), 0 0 48px rgba(245,196,81,0.22);
      animation: floaty 5s ease-in-out infinite; overflow: hidden;
      transform: translateZ(0);
    }
    .crest img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
    .start-title {
      font-family: 'Cormorant Garamond', serif; font-size: clamp(2rem, 5vw, 3.4rem); font-weight: 600;
      letter-spacing: 0.02em;
      background: linear-gradient(120deg, var(--text), var(--gold), var(--text));
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }
    .start-sub { color: var(--text-soft); font-size: clamp(1rem, 2vw, 1.2rem); max-width: 560px; line-height: 1.6; }

    .card-wrap { perspective: 1400px; z-index: 20; }
    .card {
      background: linear-gradient(160deg, rgb(10,31,61), rgb(6,20,39));
      border: 1px solid var(--glass-border);
      border-top: 1px solid var(--glass-hi); border-left: 1px solid var(--glass-hi);
      padding: clamp(40px, 5vw, 72px) clamp(32px, 5vw, 64px); border-radius: 26px;
      width: min(860px, 94vw);
      box-shadow: 0 30px 70px rgba(0,0,0,0.6), inset 0 0 30px rgba(245,196,81,0.05);
      transition: transform 0.15s ease-out;
      position: relative; overflow: hidden; will-change: transform; isolation: isolate;
      transform: translateZ(0);
    }
    .card-eyebrow { animation: fadeUp 0.7s 0.3s both; }
    .card-avatar { animation: avatarPop 0.8s 0.45s both; }
    .card-name { animation: fadeUp 0.7s 0.6s both; }
    .role-chips { animation: fadeUp 0.7s 0.8s both; }
    .card-quote {
      margin-top: 28px; padding-top: 24px; border-top: 1px solid var(--glass-border);
      font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: clamp(1.05rem, 2vw, 1.3rem);
      line-height: 1.7; color: var(--text-soft); text-align: center;
      animation: fadeUp 0.8s 1s both;
    }
    .card-quote::before { content: '“'; color: var(--gold); font-size: 2.2rem; line-height: 0; vertical-align: -0.4em; margin-right: 4px; }
    .card-quote::after { content: '”'; color: var(--gold); font-size: 2.2rem; line-height: 0; vertical-align: -0.4em; margin-left: 4px; }
    .ripple-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 5; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes avatarPop { 0% { opacity: 0; transform: scale(0.4); } 60% { opacity: 1; transform: scale(1.12); } 100% { opacity: 1; transform: scale(1); } }
    .card::after {
      content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }
    .card-eyebrow { color: var(--gold); letter-spacing: 0.32em; text-transform: uppercase; font-size: 0.78rem; font-weight: 600; margin-bottom: 18px; }
    .card-avatar {
      width: 96px; height: 96px; border-radius: 50%; margin: 0 auto 22px;
      border: 2px solid var(--gold); object-fit: cover; display: block;
      box-shadow: 0 0 24px var(--gold-glow);
    }
    .card-name {
      font-family: 'Cormorant Garamond', serif; font-size: clamp(2.4rem, 6vw, 3.6rem); font-weight: 600; line-height: 1.25; margin-bottom: 22px; padding-bottom: 0.12em;
      background: linear-gradient(110deg, var(--text), var(--gold), var(--text)); background-size: 250% auto;
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
      animation: shimmer 5s linear infinite;
    }
    .role-chips { display: flex; flex-wrap: wrap; gap: 0; justify-content: center; margin-bottom: 26px; color: var(--text-soft); font-size: 1rem; font-weight: 400; line-height: 1.6; }
    .chip { padding: 0; }
    .chip + .chip::before { content: ' · '; color: var(--gold); margin: 0 4px; }
    .card-newrole { margin-top: 10px; font-size: 1.05rem; color: var(--muted); letter-spacing: 0.2px; }
    .new-role-text { color: var(--gold); font-weight: 600; }
    .letter-wrap {
      position: relative; max-width: 760px; width: min(760px, 94vw); margin: 0 auto;
      background: 
        radial-gradient(ellipse at 15% 0%, rgba(245,196,81,0.10), transparent 55%),
        radial-gradient(ellipse at 85% 100%, rgba(74,144,217,0.12), transparent 55%),
        linear-gradient(160deg, rgba(10,31,61,0.92), rgba(6,20,39,0.96));
      border: 1px solid var(--glass-border);
      border-top: 1px solid var(--glass-hi); border-left: 1px solid var(--glass-hi);
      border-radius: 26px; padding: clamp(40px, 5vw, 64px) clamp(32px, 5vw, 56px);
      box-shadow: 0 30px 70px rgba(0,0,0,0.6), inset 0 0 30px rgba(245,196,81,0.05);
      overflow: hidden;
      isolation: isolate;
      transform: translateZ(0);
    }
    .letter-wrap.scrollable {
      overflow-y: auto;
      max-height: 80vh;
      scrollbar-width: thin;
      scrollbar-color: var(--blue) transparent;
    }
    .letter-wrap::-webkit-scrollbar { width: 6px; }
    .letter-wrap::-webkit-scrollbar-thumb { background: var(--blue); border-radius: 999px; }
    .letter-wrap::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      z-index: 3;
    }
    .letter {
      font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 400; font-style: normal;
      font-size: clamp(1.15rem, 2.4vw, 1.45rem); line-height: 1.75; color: var(--text-soft);
      position: relative; z-index: 2; min-height: 2.4em; letter-spacing: 0.005em;
    }
    .letter .em { color: var(--gold); font-weight: 600; font-style: normal; }
    .letter .opener {
      color: var(--gold); font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 700; font-style: normal;
      display: block; margin-bottom: 32px; letter-spacing: 0.04em; text-transform: none;
      font-size: clamp(1.5rem, 3.8vw, 2.1rem); text-align: center; border-bottom: 1px solid var(--glass-border);
      padding-bottom: 22px; position: relative; line-height: 1.2;
      text-shadow: 0 2px 18px rgba(245,196,81,0.25);
    }
    .letter .opener::after {
      content: '♛'; display: block; margin-top: 16px; font-size: 1.3rem; color: var(--gold);
      opacity: 0.7; letter-spacing: 0; text-transform: none;
    }
    .sign {
      margin-top: 32px; color: var(--text); font-family: 'Great Vibes', cursive; font-weight: 400; font-style: normal;
      font-size: clamp(1.5rem, 3vw, 2rem); letter-spacing: 0.01em; text-align: right; line-height: 1.3;
      position: relative; z-index: 2;
    }
    .sign::before {
      content: ''; display: block; width: 60px; height: 1px; margin: 0 0 14px auto;
      background: linear-gradient(90deg, transparent, var(--gold));
    }

    .roster-title { font-family: 'Cormorant Garamond', serif; font-size: clamp(1.6rem, 4vw, 2.4rem); margin-bottom: 8px; }
    .roster-sub { color: var(--text-dim); margin-bottom: 30px; font-size: 0.98rem; }
    .roster {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px;
      width: min(960px, 95vw); max-height: 52vh; overflow-y: auto; padding: 4px;
      scrollbar-width: thin; scrollbar-color: var(--blue) transparent;
    }
    .roster::-webkit-scrollbar { width: 6px; }
    .roster::-webkit-scrollbar-thumb { background: var(--blue); border-radius: 999px; }
    .person {
      display: flex; align-items: center; gap: 16px; padding: 16px 20px;
      border: 1px solid var(--glass-border); border-radius: 16px; background: var(--glass); text-align: left;
      transition: transform .25s ease, border-color .25s, background .25s;
      transform: translateZ(0);
    }
    .person:hover { transform: translateY(-3px); border-color: var(--gold); background: rgba(245,196,81,0.06); }
    .person.you { border-color: var(--gold); background: rgba(245,196,81,0.12); box-shadow: 0 0 24px var(--gold-glow); }
    .person .pavatar {
      width: 56px; height: 56px; border-radius: 50%;
      border: 2px solid var(--gold); object-fit: cover; flex-shrink: 0;
    }
    .person .pavatar.placeholder { display: flex; align-items: center; justify-content: center; color: var(--gold); font-size: 1.2rem; background: rgba(245,196,81,0.1); }
    .person .pinfo { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
    .person .pname { font-weight: 600; font-size: 1rem; color: var(--text); }
    .person .prole { font-size: 0.85rem; color: var(--text-dim); line-height: 1.4; }
    .person .prole span + span::before { content: ' · '; color: var(--blue); }
    .you-badge { display: inline-block; margin-left: 8px; padding: 2px 8px; border-radius: 999px; background: var(--gold); color: var(--bg-deep); font-size: 0.66rem; font-weight: 700; letter-spacing: 0.08em; vertical-align: middle; }

    .blaster { cursor: pointer; z-index: 20; }
    .blaster-emoji { font-size: clamp(6rem, 16vw, 10rem); filter: drop-shadow(0 12px 28px rgba(0,0,0,0.55)); transition: transform 0.12s cubic-bezier(0.175,0.885,0.32,1.275); animation: floaty 3s ease-in-out infinite; transform: translateZ(0); }
    .instruction { margin-top: 26px; color: var(--text-soft); letter-spacing: 0.12em; font-size: 1.05rem; }
    .pressure { width: 240px; height: 10px; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); border-radius: 999px; margin: 22px auto 0; overflow: hidden; }
    .pressure-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--gold), var(--blue-light)); box-shadow: 0 0 14px var(--gold-glow); transition: width 0.18s ease-out; }

    .notfound { text-align: center; max-width: 560px; }
    .notfound h1 { font-family: 'Cormorant Garamond', serif; font-size: 2.4rem; margin-bottom: 14px; }
    .notfound p { color: var(--text-soft); line-height: 1.7; margin-bottom: 22px; }

    .letter-content, .sign {
      opacity: 0;
      transform: scaleY(0);
      transform-origin: top;
      transition: transform 0.7s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.5s ease;
    }
    .letter-content.show, .sign.show {
      opacity: 1;
      transform: scaleY(1);
    }

    .tap-to-read {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1.3rem;
      color: var(--gold);
      margin-top: 24px;
      letter-spacing: 0.08em;
      animation: pulse 1.8s infinite;
      cursor: pointer;
    }

    @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0;} }
    @keyframes pulse { 0%,100%{opacity:0.35;} 50%{opacity:1;} }
    @keyframes shimmer { 0%{background-position:0% center;} 100%{background-position:250% center;} }
    @keyframes floaty { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-8px);} }
    .shake { animation: shake 0.32s cubic-bezier(.36,.07,.19,.97) both; }
    @keyframes shake {
      10%,90%{transform:translate3d(-2px,0,0) rotate(-2deg);}
      20%,80%{transform:translate3d(4px,0,0) rotate(2deg);}
      30%,50%,70%{transform:translate3d(-8px,0,0) rotate(-5deg);}
      40%,60%{transform:translate3d(8px,0,0) rotate(5deg);}
    }
    @media (max-width: 600px) {
      .line { min-height: 8rem; font-size: 1.4rem; }
      .letter { font-size: 1.05rem; line-height: 1.7; }
      .letter .opener { font-size: 1.35rem; letter-spacing: 0.02em; }
      .sign { font-size: 1.4rem; }
    }
  </style>
</head>
<body>
  <div class="ambient">
    <div class="board"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="grain"></div>
  </div>

  <div id="scene-start" class="scene active">
    <div class="start-wrap">
      <div class="crest" id="crest">♛</div>
      <div class="start-title serif" id="start-title">Chess Năng Khiếu</div>
      <div class="start-sub" id="start-sub"></div>
      <button class="btn btn-primary show" id="start-btn" onclick="startExperience()">Mở thư</button>
    </div>
  </div>

  <div id="scenes"></div>

  <div id="scene-blaster" class="scene">
    <div class="blaster" id="blaster">
      <div class="blaster-emoji" id="blaster-icon">🎉</div>
      <div class="instruction" id="blaster-instruction">Chạm 5 lần để bung nắp thư!</div>
      <div class="pressure"><div class="pressure-fill" id="pressure"></div></div>
    </div>
  </div>

  <div id="scene-reveal" class="scene">
    <div class="card-wrap">
      <div class="card" id="tilt-card">
        <div class="card-eyebrow" id="reveal-eyebrow">Chúc mừng em</div>
        <img class="card-avatar" id="reveal-avatar" alt="" />
        <div class="card-name serif" id="reveal-name">—</div>
        <div class="role-chips" id="reveal-chips"></div>
        <div class="card-newrole" id="reveal-newrole"></div>
        <div class="card-quote" id="reveal-quote"></div>
      </div>
    </div>
  </div>
  <canvas id="ripple-canvas" class="ripple-canvas"></canvas>

  <div id="scene-letter" class="scene">
    <div class="letter-wrap">
      <div class="letter" id="letter-body"></div>
    </div>
  </div>

  <div id="scene-roster" class="scene">
    <div class="roster-title serif" id="roster-title">Tập thể Core Team 2026–2027</div>
    <div class="roster-sub" id="roster-sub"></div>
    <div class="roster" id="roster"></div>
    <button class="btn show" id="restart-btn" onclick="restart()">Đọc lại</button>
  </div>

  <div id="scene-notfound" class="scene">
    <div class="notfound">
      <h1 class="serif" id="nf-title">Xin lỗi em</h1>
      <p id="nf-message"></p>
      <button class="btn btn-primary show" id="nf-btn">Liên hệ anh chị</button>
    </div>
  </div>

  <script>
    // ============ DATA ============
    let DATA;
    let member;

    function applyConfig(cfg) {
      DATA = cfg;
      const club = cfg.club;

      document.getElementById('crest').innerHTML = /\.(jpe?g|png|svg|webp|gif|bmp)$/i.test(club.crest) ? `<img src="${club.crest}" alt="logo" />` : club.crest;
      document.getElementById('start-title').textContent = club.title;
      document.getElementById('start-sub').innerHTML = club.intro;
      document.getElementById('start-btn').textContent = club.startButton;
      document.getElementById('blaster-icon').textContent = cfg.blaster.emoji;
      document.getElementById('blaster-instruction').textContent = cfg.blaster.instruction;
      document.getElementById('reveal-eyebrow').textContent = cfg.reveal.eyebrow;
      document.getElementById('roster-title').textContent = cfg.roster.title;
      document.getElementById('roster-sub').textContent = cfg.roster.subtitle;
      document.getElementById('restart-btn').textContent = cfg.roster.restartButton;
      document.getElementById('nf-title').textContent = cfg.notFound.title;
      document.getElementById('nf-message').textContent = cfg.notFound.message;
      const nfBtn = document.getElementById('nf-btn');
      nfBtn.textContent = cfg.notFound.contactButton;
      nfBtn.onclick = () => { location.href = 'mailto:' + cfg.notFound.contactEmail; };

      document.title = club.tabTitle;
      document.getElementById('favicon').href = club.favicon;
      document.getElementById('meta-desc').content = club.shareDesc;
      document.getElementById('og-title').content = club.title;
      document.getElementById('og-desc').content = club.shareDesc;
      document.getElementById('og-image').content = club.shareImage;

      ambientAudioEl = new Audio(cfg.audio.ambient);
      ambientAudioEl.loop = true;
      ambientAudioEl.preload = 'auto';
      ambientAudioEl.volume = cfg.audio.volume;
      ambientAudioEl.muted = cfg.audio.muted;
      ambientAudioEl.addEventListener('error', () => { ambientAudioEl = null; });
      ambientAudioEl.load();

      openLetterAudioEl = new Audio(cfg.audio.openLetter);
      openLetterAudioEl.preload = 'auto';
      openLetterAudioEl.volume = cfg.audio.volume;
      openLetterAudioEl.muted = cfg.audio.muted;
      openLetterAudioEl.load();

      audioMuted = cfg.audio.muted;

      const personId = new URLSearchParams(location.search).get('person');
      member = cfg.members.find(m => m.id === personId);

      if (!member) {
        document.querySelectorAll('.scene').forEach(s => s.classList.remove('active'));
        document.getElementById('scene-notfound').classList.add('active');
        return;
      }
      buildTypeScenes(cfg.lines);
    }

    function loadConfig() {
      fetch('custom.json?ts=' + Date.now())
        .then(r => r.json())
        .then(applyConfig)
        .catch(() => {
          console.error('Không thể tải custom.json');
        });
    }

    // ============ AUDIO ============
    let audioCtx;
    let ambientAudioEl;
    let openLetterAudioEl;
    let ambientStarted = false;
    let audioMuted = false;

    function ensureAudio() {
      if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} }
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }
    function tone(freq, start, dur, type='sine', gain=0.18) {
      const ctx = ensureAudio(); if (!ctx) return;
      const o = ctx.createOscillator(); const g = ctx.createGain();
      o.type = type; o.frequency.value = freq;
      o.connect(g); g.connect(ctx.destination);
      const t = ctx.currentTime + start;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(gain, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.start(t); o.stop(t + dur + 0.05);
    }
    function clickSound() { tone(740, 0, 0.04, 'square', 0.04); }

    function fanfare() {
      const notes = [392, 523.25, 659.25, 783.99, 1046.5];
      notes.forEach((f, i) => tone(f, i * 0.16, 0.5, 'sawtooth', 0.16));
      tone(1046.5, notes.length * 0.16, 1.2, 'sawtooth', 0.18);
      tone(1318.51, notes.length * 0.16, 1.2, 'sine', 0.1);
    }

    function playCelebration() {
      try {
        ensureAudio();
        const celebrationAudioEl = new Audio(DATA.audio.celebration);
        celebrationAudioEl.volume = DATA.audio.volume;
        celebrationAudioEl.muted = audioMuted;
        celebrationAudioEl.play().catch(() => fanfare());
      } catch (e) { fanfare(); }
    }

    function playOpenLetterSound() {
      if (openLetterAudioEl) {
        try {
          openLetterAudioEl.currentTime = 0;
          openLetterAudioEl.play().catch(() => {});
        } catch (e) {}
      }
    }

    // ============ RIPPLE SPREAD ============
    let rippleTimer;
    let rippleCanvas, rippleCtx, rippleRAF;
    let ripples = [];
    const rippleColors = ['#f5c451', '#4a90d9', '#e8b86d', '#2b6cb0', '#ffe9a8', '#c66053'];
    const rippleSpots = [
      [0.08, 0.06], [0.22, 0.38], [0.32, 0.20], [0.42, 0.62],
      [0.68, 0.08], [0.38, 0.82], [0.70, 0.88], [0.86, 0.34],
      [0.94, 0.72], [0.14, 0.68],
    ];
    let rippleIdx = 0;
    function resizeRippleCanvas() {
      const c = document.getElementById('ripple-canvas');
      if (!c) return;
      c.width = window.innerWidth;
      c.height = window.innerHeight;
    }
    function addRipple() {
      if (!rippleCtx) return;
      const [tF, lF] = rippleSpots[rippleIdx % rippleSpots.length];
      rippleIdx++;
      ripples.push({
        x: lF * window.innerWidth,
        y: tF * window.innerHeight,
        born: performance.now(),
        color: rippleColors[Math.floor(Math.random() * rippleColors.length)],
      });
      if (!rippleRAF) rippleRAF = requestAnimationFrame(drawRipples);
    }
    function drawRipples() {
      const c = rippleCanvas, ctx = rippleCtx;
      if (!c || !ctx) { rippleRAF = null; return; }
      ctx.clearRect(0, 0, c.width, c.height);
      const now = performance.now();
      const DUR = 2000;
      const maxR = Math.max(c.width, c.height) * 0.7;
      ripples = ripples.filter(rp => now - rp.born < DUR);
      for (const rp of ripples) {
        const p = (now - rp.born) / DUR;
        const r = 8 + (maxR - 8) * p;
        const alpha = p < 0.15 ? (p / 0.15) * 0.7 : 0.7 * (1 - (p - 0.15) / 0.85);
        ctx.beginPath();
        ctx.arc(rp.x, rp.y, r, 0, Math.PI * 2);
        ctx.fillStyle = rp.color;
        ctx.globalAlpha = Math.max(0, alpha);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      rippleRAF = ripples.length ? requestAnimationFrame(drawRipples) : null;
    }
    function startRippleSpread() {
      rippleCanvas = document.getElementById('ripple-canvas');
      if (rippleCanvas) {
        resizeRippleCanvas();
        rippleCtx = rippleCanvas.getContext('2d');
      }
      ripples = []; rippleIdx = 0;
      for (let i = 0; i < 3; i++) setTimeout(addRipple, i * 300);
      rippleTimer = setInterval(addRipple, 1200);
    }
    function stopRippleSpread() {
      if (rippleTimer) { clearInterval(rippleTimer); rippleTimer = null; }
      ripples = [];
      if (rippleCtx && rippleCanvas) rippleCtx.clearRect(0, 0, rippleCanvas.width, rippleCanvas.height);
      if (rippleRAF) { cancelAnimationFrame(rippleRAF); rippleRAF = null; }
    }
    window.addEventListener('resize', resizeRippleCanvas);
    function startAmbient() {
      if (ambientStarted) return; ambientStarted = true;
      if (audioMuted) return;
      if (ambientAudioEl) {
        ensureAudio();
        const el = ambientAudioEl;
        const tryPlay = () => {
          el.play().catch(() => {
            setTimeout(() => { el.play().catch(() => { ambientAudioEl = null; startSynthAmbient(); }); }, 300);
          });
        };
        if (el.readyState >= 2) tryPlay();
        else el.addEventListener('canplay', tryPlay, { once: true });
        return;
      }
      startSynthAmbient();
    }
    function startSynthAmbient() {
      const ctx = ensureAudio(); if (!ctx) return;
      [130.81, 196, 261.63].forEach(f => {
        const o = ctx.createOscillator(); const g = ctx.createGain();
        o.type = 'sine'; o.frequency.value = f;
        o.connect(g); g.connect(ctx.destination);
        g.gain.setValueAtTime(0, ctx.currentTime);
        g.gain.linearRampToValueAtTime(0.045, ctx.currentTime + 2);
        o.start();
      });
    }

    // ============ TYPEWRITER ============
    function typeText(el, text, onDone) {
      const tick = clickSound;
      el.innerHTML = '';
      let i = 0;
      const speed = 38;
      (function type() {
        if (i < text.length) {
          if (text.slice(i).startsWith('<em>')) {
            const end = text.indexOf('</em>', i);
            const inner = text.slice(i + 4, end);
            const span = document.createElement('span');
            span.className = 'em'; span.innerHTML = inner;
            el.appendChild(span);
            i = end + 5;
            setTimeout(type, speed * 3);
            return;
          }
          el.appendChild(document.createTextNode(text[i]));
          if (text[i] !== ' ' && i % 2 === 0) tick();
          i++;
          setTimeout(type, speed + (/[.,—]/.test(text[i - 1]) ? 220 : 0));
        } else {
          setTimeout(onDone, 400);
        }
      })();
    }

    // ============ SCENE ENGINE ============
    const scenesEl = document.getElementById('scenes');
    let lines = [];

    function buildTypeScene(index) {
      const div = document.createElement('div');
      div.className = 'scene'; div.id = `scene-line-${index}`;
      div.innerHTML = `
        <div class="line"><span id="typed-${index}"></span><span class="cursor"></span></div>
        <button class="btn" id="next-${index}">Tiếp tục</button>
      `;
      scenesEl.appendChild(div);
      return div;
    }
    function buildTypeScenes(texts) {
      lines = texts;
      scenesEl.innerHTML = '';
      lines.forEach((l, i) => {
        buildTypeScene(i);
        document.getElementById(`next-${i}`).onclick = () => goNext(i);
      });
    }

    function showScene(id) {
      document.querySelectorAll('.scene').forEach(s => s.classList.remove('active'));
      const el = document.getElementById(id);
      if (el) el.classList.add('active');
      if (id !== 'scene-reveal') {
        const card = document.getElementById('tilt-card');
        if (card) card.style.transform = '';
      }
    }

    function startExperience() {
      ensureAudio(); startAmbient();
      const shortName = member.name.split(' ').pop();
      lines[0] = lines[0].replace(/^(Chào\s+)[^,]*,?$/i, `$1${shortName},`);
      showScene('scene-line-0');
      runLine(0);
    }

    function runLine(index) {
      const typedEl = document.getElementById(`typed-${index}`);
      const btn = document.getElementById(`next-${index}`);
      btn.classList.remove('show');
      typeText(typedEl, lines[index], () => btn.classList.add('show'));
    }

    function goNext(index) {
      const next = index + 1;
      if (next < lines.length) {
        showScene(`scene-line-${next}`);
        runLine(next);
      } else {
        showScene('scene-blaster');
      }
    }

    // ============ BLASTER ============
    const blaster = document.getElementById('blaster');
    const blasterIcon = document.getElementById('blaster-icon');
    const pressureFill = document.getElementById('pressure');
    let taps = 0;
    blaster.addEventListener('click', () => {
      const required = DATA.blaster.requiredTaps;
      if (taps >= required) return;
      taps++;
      pressureFill.style.width = `${(taps / required) * 100}%`;
      blasterIcon.style.transform = `scale(${1 + taps * 0.2})`;
      blaster.classList.remove('shake'); void blaster.offsetWidth; blaster.classList.add('shake');
      clickSound();
      if (taps === required) {
        blasterIcon.style.transform = 'scale(0) rotate(180deg)';
        blasterIcon.style.opacity = '0';
        playCelebration();
        setTimeout(() => { showScene('scene-reveal'); triggerReveal(); }, 600);
      }
    });

    // ============ REVEAL ============
    let revealClicked = false;
    function triggerReveal() {
      revealClicked = false;
      const colors = ['#f5c451', '#4a90d9', '#e8b86d', '#ffffff', '#2b6cb0', '#ffe9a8'];
      const gold = ['#f5c451', '#e8b86d', '#ffe9a8', '#fff3c4'];

      confetti({ particleCount: 80, spread: 80, origin: { x: 0.1, y: 1 }, angle: 60, colors });
      confetti({ particleCount: 80, spread: 80, origin: { x: 0.9, y: 1 }, angle: 120, colors });
      setTimeout(() => confetti({ particleCount: 60, spread: 100, origin: { x: 0, y: 0.6 }, angle: 20, colors: gold }), 300);
      setTimeout(() => confetti({ particleCount: 60, spread: 100, origin: { x: 1, y: 0.6 }, angle: 160, colors: gold }), 600);
      setTimeout(() => confetti({ particleCount: 120, spread: 360, origin: { x: 0.5, y: 0.45 }, colors, startVelocity: 45, scalar: 1.2 }), 1200);

      const stars = () => confetti({ particleCount: 3, angle: 90, spread: 120, origin: { x: Math.random(), y: -0.1 }, colors, scalar: 0.9, gravity: 0.8 });
      stars();
      setTimeout(stars, 400);
      setTimeout(stars, 800);

      startRippleSpread();

      document.getElementById('reveal-name').textContent = member.name;
      const av = document.getElementById('reveal-avatar');
      av.src = member.avatar;
      av.style.display = 'block';

      const chips = document.getElementById('reveal-chips');
      chips.innerHTML = '';
      member.roles.forEach(r => {
        const c = document.createElement('div');
        c.className = 'chip';
        c.textContent = r;
        chips.appendChild(c);
      });

      document.getElementById('reveal-newrole').innerHTML = `đã trở thành <span class="new-role-text">${member.newRole}</span> Chess Năng Khiếu nhiệm kỳ 2026 - 2027`;
      document.getElementById('reveal-quote').textContent = DATA.reveal.quote;

      const card = document.getElementById('tilt-card');
      document.addEventListener('mousemove', (e) => {
        if (!document.getElementById('scene-reveal').classList.contains('active')) return;
        const targetX = (window.innerWidth / 2 - e.pageX) / 55;
        const targetY = (window.innerHeight / 2 - e.pageY) / 55;
        card.style.transform = `perspective(1000px) rotateY(${targetX}deg) rotateX(${targetY}deg)`;
      }, { passive: true });

      document.getElementById('scene-reveal').addEventListener('click', () => {
        if (!revealClicked) {
          revealClicked = true;
          goLetter();
        }
      }, { once: true });
    }

    function goLetter() {
      showScene('scene-letter');
      const body = document.getElementById('letter-body');
      body.innerHTML = '';

      const shortName = member.name.split(' ').pop();
      const opener = document.createElement('div');
      opener.className = 'opener';
      opener.textContent = `${DATA.letter.opener} ${shortName}`;
      body.appendChild(opener);

      const tapHint = document.createElement('div');
      tapHint.className = 'tap-to-read';
      tapHint.textContent = 'Chạm để mở thư';
      body.appendChild(tapHint);

      const letterContent = document.createElement('div');
      letterContent.className = 'letter-content';
      letterContent.style.whiteSpace = 'pre-line';
      letterContent.textContent = member.letter;
      body.appendChild(letterContent);

      const sign = document.createElement('div');
      sign.className = 'sign';
      sign.textContent = DATA.letter.sign;
      body.appendChild(sign);

      let letterOpened = false;

      const openLetter = () => {
        if (letterOpened) return;
        letterOpened = true;
        tapHint.style.display = 'none';
        letterContent.classList.add('show');
        sign.classList.add('show');
        playOpenLetterSound();

        const letterWrap = document.querySelector('.letter-wrap');
        if (letterWrap) letterWrap.classList.add('scrollable');

        const continueBtn = document.createElement('button');
        continueBtn.className = 'btn show';
        continueBtn.textContent = 'Tiếp tục';
        continueBtn.style.marginTop = '32px';
        continueBtn.onclick = () => { goRoster(); };
        body.appendChild(continueBtn);
      };

      document.getElementById('scene-letter').addEventListener('click', openLetter, { once: true });
    }

    function goRoster() {
      stopRippleSpread();
      showScene('scene-roster');
      const r = document.getElementById('roster');
      r.innerHTML = '';
      const fragment = document.createDocumentFragment();
      DATA.members.forEach(m => {
        const d = document.createElement('div');
        d.className = 'person' + (m.id === member.id ? ' you' : '');
        const avHtml = `<img class="pavatar" src="${m.avatar}" alt="" loading="lazy" />`;
        const youBadge = (m.id === member.id && DATA.roster.youLabel) ? `<span class="you-badge">${DATA.roster.youLabel}</span>` : '';
        d.innerHTML = `${avHtml}<div class="pinfo"><div class="pname">${m.name}${youBadge}</div><div class="prole"><span>${m.newRole}</span></div></div>`;
        fragment.appendChild(d);
      });
      r.appendChild(fragment);
    }

    function restart() {
      taps = 0; pressureFill.style.width = '0%';
      blasterIcon.style.transform = ''; blasterIcon.style.opacity = '';
      showScene('scene-start');
    }

    loadConfig();
  </script>
</body>
</html>
